[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "conebound"
version = "0.1.0"
description = "Exact scalar witness and independent rational certificate replay for ConeBound"
requires-python = ">=3.12"
dependencies = []
authors = [{name = "Suneet Dungrani", email = "suneetdungrani@utexas.edu"}]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
figures = ["numpy==2.5.4", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
